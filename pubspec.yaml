name: fit_routine
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.0.0
  firebase_ai: ^5.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#7CB342"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#7CB342"
    theme_color: "#7CB342"
