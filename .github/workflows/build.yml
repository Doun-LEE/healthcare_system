name: Release APK

# main 에 push 될 때마다:
#   1) 마지막 태그(vX.Y.Z)에서 패치 버전을 +1 (커밋 메시지에 #minor / #major 가 있으면 그 자리)
#   2) 릴리스 키로 서명한 APK 를 ldw_healthcare_system_vX.Y.Z.apk 로 빌드
#   3) 태그를 만들고 GitHub Releases 에 올린다 → 앱이 "새 버전" 으로 감지
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        shell: bash
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last=${last:-v0.1.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          msg="$(git log -1 --pretty=%B)"
          if echo "$msg" | grep -q '#major'; then major=$((major+1)); minor=0; patch=0
          elif echo "$msg" | grep -q '#minor'; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          next="$major.$minor.$patch"
          if [ "${{ github.event_name }}" != "push" ]; then next="$next-dev"; fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "last=$last next=v$next"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore release keystore
        if: github.event_name == 'push'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret 이 없어 debug 키로 서명합니다. 릴리스는 만들지 않습니다."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ldw_healthcare_system_${{ steps.ver.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ldw_healthcare_system_${{ steps.ver.outputs.tag }}
          path: dist/*.apk

      - name: Tag and publish release
        if: github.event_name == 'push' && env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
