name: Deploy Web (GitHub Pages)

# APK 릴리스(Release APK)가 끝난 뒤에 돈다. 그래야 그 커밋에 붙은 v* 태그를 읽어
# 웹과 APK 버전 번호가 항상 같다(동시에 돌면 태그가 아직 없어 한 단계 낮게 찍힘).
on:
  workflow_run:
    workflows: ["Release APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 릴리스가 성공한 경우(또는 수동 실행)에만. 뒤 커밋에 밀려 취소된 릴리스는 건너뛴다.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # APK 와 같은 버전 번호를 쓴다 (build.yml 과 같은 계산).
      - name: Compute version
        id: ver
        shell: bash
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last=${last:-v0.1.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          msg="$(git log -1 --pretty=%B)"
          if echo "$msg" | grep -q '#major'; then major=$((major+1)); minor=0; patch=0
          elif echo "$msg" | grep -q '#minor'; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          # 이 커밋에 이미 태그가 붙어 있으면(릴리스가 먼저 끝난 경우) 그 태그를 쓴다.
          here=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)
          [ -n "$here" ] && major=$(echo "${here#v}" | cut -d. -f1) && minor=$(echo "${here#v}" | cut -d. -f2) && patch=$(echo "${here#v}" | cut -d. -f3)
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      # 저장소 이름이 URL 경로가 된다: https://doun-lee.github.io/healthcare_system/
      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --pwa-strategy offline-first \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
